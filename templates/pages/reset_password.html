{% extends "base.html" %}
{% load static %}
{% block title %}Reset Password — SevaJobs{% endblock %}
{% block content %}
<section class="section d-flex align-items-center" style="min-height:70vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="sj-auth-card animate-fade-up text-center">
          <div class="ico ico-gradient-cool mx-auto mb-3" style="width:64px;height:64px;border-radius:18px;font-size:1.5rem;"><i class="bi bi-key"></i></div>
          <h3 class="fw-800 mb-2">Set new password</h3>
          <p class="text-muted-2 fs-sm mb-4">Your new password must be at least 8 characters.</p>
          <form method="post" class="text-start needs-validation" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label for="password" class="form-label">New Password</label>
              <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="New password" required minlength="8" data-password-strength="pwd-meter-reset">
              <div class="pwd-strength" id="pwd-meter-reset"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
              <div class="pwd-strength-text"></div>
            </div>
            <div class="mb-4">
              <label for="password2" class="form-label">Confirm New Password</label>
              <input type="password" class="form-control form-control-lg" id="password2" name="password2" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="btn btn-gradient btn-lg w-100 mb-3"><i class="bi bi-check-lg me-1"></i> Reset Password</button>
          </form>
          <a href="{% url 'accounts:login' %}" class="fs-sm text-muted-2"><i class="bi bi-arrow-left me-1"></i> Back to login</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
{% block extra_js %}<script src="{% static 'js/forms.js' %}" defer></script>{% endblock %}
