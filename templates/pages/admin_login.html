{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin Portal — SevaJobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/main.css' %}" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .admin-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    .admin-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .admin-header .bi-shield-lock {
      font-size: 3rem;
      color: #3b82f6;
    }
  </style>
</head>
<body>


  <div class="admin-card">
    <div class="admin-header">
      <i class="bi bi-shield-lock"></i>
      <h4 class="fw-bold mt-2">Admin Access</h4>
      <p class="text-muted fs-sm">SevaJobs Management Portal</p>
    </div>

    <form method="post" class="needs-validation" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">

      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Admin Email</label>
        <div class="input-icon-group">
          <i class="bi bi-person input-icon"></i>
          <input type="email" class="form-control" id="email" name="email" value="{{ email|default:'' }}"
                 placeholder="admin@sevajobs.com" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-icon-group position-relative">
          <i class="bi bi-key input-icon"></i>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Enter secure password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold">
        <i class="bi bi-unlock me-1"></i> Authenticate
      </button>
    </form>
    
    <div class="mt-4 text-center">
      <a href="/" class="text-muted fs-xs text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i> Return to public site
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

  {% if messages %}
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      {% for message in messages %}
        Swal.fire({
          icon: '{% if message.tags == "error" %}error{% elif message.tags == "success" %}success{% elif message.tags == "warning" %}warning{% else %}info{% endif %}',
          text: '{{ message|escapejs }}',
          confirmButtonColor: '#3b82f6',
          timer: 4000,
          timerProgressBar: true,
          showConfirmButton: false,
          toast: true,
          position: 'top-end'
        });
      {% endfor %}
    });
  </script>
  {% endif %}
</body>
</html>
