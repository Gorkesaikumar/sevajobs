{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staff Login — SevaJobs</title>
  <meta name="description" content="SevaJobs Staff Portal — sign in with your email and password to manage job postings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/main.css' %}" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f0f0ff 0%, #e8f4fd 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    .staff-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.12), 0 2px 8px rgba(0,0,0,0.06);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }
    .staff-icon-wrap {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
    }
    .staff-icon-wrap i { font-size: 2rem; color: #fff; }
    .staff-header { text-align: center; margin-bottom: 1.75rem; }
    .btn-staff { background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; color: #fff; font-weight: 700; }
    .btn-staff:hover { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff; }
    .form-control:focus { border-color: #8b5cf6; box-shadow: 0 0 0 0.2rem rgba(139,92,246,0.18); }
    .portal-badge {
      display: inline-block;
      background: rgba(139,92,246,0.1);
      color: #7c3aed;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="staff-card">
    <div class="staff-header">
      <div class="staff-icon-wrap">
        <i class="bi bi-person-badge-fill"></i>
      </div>
      <span class="portal-badge">Staff Portal</span>
      <h4 class="fw-bold mb-1" style="color:#1e1b4b;">Welcome Back</h4>
      <p class="text-muted fs-sm mb-0">Sign in to your SevaJobs Staff account</p>
    </div>

    <form method="post" id="staffLoginForm" class="needs-validation" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">

      <!-- Email -->
      <div class="mb-3">
        <label for="id_staff_email" class="form-label fw-semibold" style="color:#374151;">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-color:#d1d5db;">
            <i class="bi bi-envelope text-muted"></i>
          </span>
          <input type="email" class="form-control border-start-0" id="id_staff_email"
                 name="username" placeholder="Enter your staff email"
                 autocomplete="email" required autofocus
                 style="border-color:#d1d5db;">
        </div>
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="id_staff_password" class="form-label fw-semibold" style="color:#374151;">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-color:#d1d5db;">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" class="form-control border-start-0" id="id_staff_password"
                 name="password" placeholder="Enter your password"
                 autocomplete="current-password" required
                 style="border-color:#d1d5db;">
          <button type="button" class="input-group-text bg-light" style="border-color:#d1d5db; cursor:pointer;"
                  onclick="togglePwd()" title="Show/Hide password">
            <i class="bi bi-eye" id="pwdToggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-staff w-100 py-2 rounded-3 mb-3">
        <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="/" class="text-muted fs-xs text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i> Return to public site
      </a>
    </div>

    <div class="border-top mt-4 pt-3 text-center">
      <p class="fs-xs text-muted mb-0">
        <i class="bi bi-shield-lock me-1"></i>
        This portal is restricted to authorized staff only.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

  <script>
    function togglePwd() {
      const input = document.getElementById('id_staff_password');
      const icon = document.getElementById('pwdToggleIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }
  </script>

  {% if messages %}
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      {% for message in messages %}
        Swal.fire({
          icon: '{% if message.tags == "error" %}error{% elif message.tags == "success" %}success{% elif message.tags == "warning" %}warning{% else %}info{% endif %}',
          text: '{{ message|escapejs }}',
          confirmButtonColor: '#8b5cf6',
          timer: 4500,
          timerProgressBar: true,
          showConfirmButton: false,
          toast: true,
          position: 'top-end'
        });
      {% endfor %}
    });
  </script>
  {% endif %}
</body>
</html>
