{% extends "base.html" %}
{% block title %}Forgot Password — SevaJobs{% endblock %}
{% block content %}
<section class="section d-flex align-items-center" style="min-height:70vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="sj-auth-card animate-fade-up text-center">
          <div class="ico ico-xl ico-gradient-primary mx-auto mb-3"><i class="bi bi-lock"></i></div>
          <h3 class="fw-800 mb-2">Forgot your password?</h3>
          <p class="text-muted-2 fs-sm mb-4">No worries. Enter your email and we'll send you a reset link.</p>
          <form method="post" class="text-start">
            {% csrf_token %}
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-icon-group">
                <i class="bi bi-envelope input-icon"></i>
                <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="name@example.com" required autofocus>
              </div>
            </div>
            <button type="submit" class="btn btn-gradient btn-lg w-100 mb-3"><i class="bi bi-send me-1"></i> Send Reset Link</button>
          </form>
          <a href="{% url 'accounts:login' %}" class="fs-sm text-muted-2"><i class="bi bi-arrow-left me-1"></i> Back to login</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
