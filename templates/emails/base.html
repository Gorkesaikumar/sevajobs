<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #334155;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        table {
            border-spacing: 0;
            border-collapse: collapse;
        }
        td {
            padding: 0;
        }
        img {
            border: 0;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f1f5f9;
            padding-bottom: 40px;
        }
        .main {
            background-color: #ffffff;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 24px 32px;
            text-align: left;
        }
        .logo-text {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-decoration: none;
        }
        .logo-accent {
            color: #6366f1;
        }
        .content {
            padding: 32px;
            font-size: 16px;
            line-height: 1.6;
            color: #334155;
        }
        .h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 16px;
        }
        .btn-container {
            margin: 28px 0;
            text-align: left;
        }
        .btn {
            background-color: #4f46e5;
            color: #ffffff !important;
            display: inline-block;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.25);
        }
        .btn:hover {
            background-color: #4338ca;
        }
        .details-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 20px;
            margin: 20px 0;
        }
        .details-row {
            margin-bottom: 10px;
        }
        .details-row:last-child {
            margin-bottom: 0;
        }
        .details-label {
            font-weight: 600;
            color: #475569;
            display: inline-block;
            width: 140px;
        }
        .details-value {
            color: #0f172a;
        }
        .footer {
            background-color: #f8fafc;
            padding: 24px 32px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }
        .footer a {
            color: #6366f1;
            text-decoration: none;
        }
        @media screen and (max-width: 600px) {
            .content {
                padding: 20px !important;
            }
            .header {
                padding: 16px 20px !important;
            }
            .details-label {
                display: block;
                width: 100%;
                margin-bottom: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <br>
        <table role="presentation" class="main" align="center">
            <tr>
                <td class="header">
                    <a href="{{ frontend_url }}" class="logo-text">Seva<span class="logo-accent">Jobs</span></a>
                </td>
            </tr>
            <tr>
                <td class="content">
                    {% block content %}
                    {% endblock %}
                </td>
            </tr>
            <tr>
                <td class="footer">
                    <p style="margin: 0 0 8px 0;">© {% now "Y" %} SevaJobs Recruitment Platform. All rights reserved.</p>
                    <p style="margin: 0;">Need help? Contact <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
