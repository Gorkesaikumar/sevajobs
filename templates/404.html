{% extends "base.html" %}
{% block title %}404 — Page Not Found — SevaJobs{% endblock %}
{% block content %}
<section class="section d-flex align-items-center" style="min-height:60vh;">
  <div class="container text-center">
    <div class="animate-scale-in">
      <div style="font-size:6rem;font-weight:900;line-height:1;background:var(--sj-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">404</div>
      <h2 class="fw-800 mt-3 mb-2">Page not found</h2>
      <p class="text-muted-2 mb-4 mx-auto" style="max-width:400px;">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div class="d-flex justify-content-center gap-2">
        <a href="/" class="btn btn-gradient"><i class="bi bi-house me-1"></i> Go Home</a>
        <a href="{% url 'core:job-search' %}" class="btn btn-outline-light-brand"><i class="bi bi-search me-1"></i> Browse Jobs</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
