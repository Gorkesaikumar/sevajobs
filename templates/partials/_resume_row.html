{# Expects `r` — a Resume object. #}
<div class="d-flex align-items-center flex-wrap gap-3 p-4 border-bottom">
  <div class="ico" style="width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:#fee2e2;color:#b91c1c;">
    <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>
  </div>
  <div class="flex-grow-1 min-w-0">
    <div class="d-flex align-items-center gap-2">
      <span class="fw-semibold text-truncate">{{ r.title }}</span>
      {% if r.is_primary %}<span class="sj-badge"><i class="bi bi-star-fill me-1"></i>Primary</span>{% endif %}
    </div>
    <small class="text-muted-2">{{ r.file_size|filesizeformat }} · Uploaded {{ r.created_at|timesince }} ago</small>
  </div>
  <div class="d-flex flex-wrap gap-1">
    <a href="{{ r.preview_url|default:'#' }}" class="btn btn-sm btn-outline-light-brand" aria-label="Preview {{ r.title }}"><i class="bi bi-eye"></i></a>
    <a href="{{ r.download_url|default:'#' }}" class="btn btn-sm btn-outline-light-brand" aria-label="Download {{ r.title }}"><i class="bi bi-download"></i></a>
    {% if not r.is_primary %}
      <button class="btn btn-sm btn-outline-light-brand" aria-label="Set {{ r.title }} as primary"><i class="bi bi-star"></i></button>
    {% endif %}
    <button class="btn btn-sm btn-outline-danger" aria-label="Delete {{ r.title }}"><i class="bi bi-trash"></i></button>
  </div>
</div>
