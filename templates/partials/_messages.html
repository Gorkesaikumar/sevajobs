{% if messages %}
  <div class="container mt-3" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm"
           role="alert">
        <span class="alert-icon" aria-hidden="true">
          {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill"></i>
          {% elif message.tags == 'error' or message.tags == 'danger' %}<i class="bi bi-exclamation-triangle-fill"></i>
          {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-circle-fill"></i>
          {% else %}<i class="bi bi-info-circle-fill"></i>
          {% endif %}
        </span>
        <div>{{ message }}</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
