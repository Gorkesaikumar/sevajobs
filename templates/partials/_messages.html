{% if messages %}
  <div class="toast-container position-fixed top-0 end-0 p-3 mt-5" style="z-index: 1060;">
    {% for message in messages %}
      <div class="toast align-items-center text-bg-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'primary' }}{% endif %} border-0 mb-2 shadow" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
        <div class="d-flex">
          <div class="toast-body fw-medium">
            <span class="me-2" aria-hidden="true">
              {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill"></i>
              {% elif message.tags == 'error' or message.tags == 'danger' %}<i class="bi bi-exclamation-triangle-fill"></i>
              {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-circle-fill"></i>
              {% else %}<i class="bi bi-info-circle-fill"></i>
              {% endif %}
            </span>
            {{ message }}
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    {% endfor %}
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var toastElList = [].slice.call(document.querySelectorAll('.toast'))
      var toastList = toastElList.map(function(toastEl) {
        return new bootstrap.Toast(toastEl)
      })
      toastList.forEach(toast => toast.show())
    });
  </script>
{% endif %}
