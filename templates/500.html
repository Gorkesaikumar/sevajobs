{% extends "base.html" %}
{% block title %}500 — Server Error — SevaJobs{% endblock %}
{% block content %}
<section class="section d-flex align-items-center" style="min-height:60vh;">
  <div class="container text-center">
    <div class="animate-scale-in">
      <div style="font-size:6rem;font-weight:900;line-height:1;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">500</div>
      <h2 class="fw-800 mt-3 mb-2">Something went wrong</h2>
      <p class="text-muted-2 mb-4 mx-auto" style="max-width:400px;">We're experiencing a server error. Our team has been notified and we're working on it.</p>
      <a href="/" class="btn btn-gradient"><i class="bi bi-house me-1"></i> Go Home</a>
    </div>
  </div>
</section>
{% endblock %}
