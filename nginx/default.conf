upstream django_web {
    server web:8000;
}

upstream webhook_listener {
    server host.docker.internal:9000;
}

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name sevajobs.in www.sevajobs.in
                sevajobs.com www.sevajobs.com
                sevajobs.co.in www.sevajobs.co.in;

    return 301 https://$host$request_uri;
}

# HTTPS Configuration
server {
    listen 443 ssl;
    http2 on;

    server_name sevajobs.in www.sevajobs.in
                sevajobs.com www.sevajobs.com
                sevajobs.co.in www.sevajobs.co.in;

    ssl_certificate /etc/letsencrypt/live/sevajobs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sevajobs.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://django_web;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
    }

    location /webhook/ {
        proxy_pass http://webhook_listener/;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name pgadmin.sevajobs.in;

    ssl_certificate /etc/letsencrypt/live/sevajobs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sevajobs.in/privkey.pem;

    location / {
        proxy_pass http://pgadmin:80;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}