upstream django_web {
    server web:8000;
}

upstream webhook_listener {
    # host.docker.internal works in some setups, but using the docker host's IP from the bridge network 
    # or simply exposing 9000 on the host and accessing it via the docker host IP is needed.
    # We will use the container's gateway IP (often 172.17.0.1) or simply bind it locally.
    # To keep it universally simple without docker routing complexities:
    server host.docker.internal:9000;
}

server {
    listen 80;
    server_name sevajobs.in www.sevajobs.in sevajobs.com www.sevajobs.com sevajobs.co.in www.sevajobs.co.in;
    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M; # Allow large file uploads for resumes

    location / {
        proxy_pass http://django_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        
        # Pass the original protocol (HTTP or HTTPS)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass http://webhook_listener/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        # Pass the original protocol (HTTP or HTTPS)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
